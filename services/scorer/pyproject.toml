[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leo-scorer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["structlog>=24.1.0","pyyaml>=6.0","grpcio>=1.62.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0","ruff>=0.3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
